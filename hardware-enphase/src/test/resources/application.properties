
# Quarkus Configuration
quarkus.log.level=INFO
quarkus.log.category."de.hatoka.eos".level=DEBUG

quarkus.rest-client."de.hatoka.eos.hardware.enphase.clients.EnphaseAuthClient".url=https://api.enphaseenergy.com
quarkus.rest-client."de.hatoka.eos.hardware.enphase.clients.EnphaseSystemDetailsClient".url=https://api.enphaseenergy.com
quarkus.rest-client."de.hatoka.eos.hardware.enphase.clients.EnphaseSiteLevelProductionMonitoringClient".url=https://api.enphaseenergy.com

eos.enphase.uri.service=https://api.enphaseenergy.com
eos.enphase.system=${ENPHASE_SYSTEM_ID}
